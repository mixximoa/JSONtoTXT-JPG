<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кадастр JSON + PDF -> TXT / JPG / KML</title>
    <!-- Proj4js для геодезичних перерахунків -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <!-- PDF.js для витягування даних із PDF довідок ДЗК -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            color: #14213d;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; font-size: 19px; color: #14213d; }
        
        .crs-select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #14213d;
            background-color: #eef4f8;
            border: 2px solid #1d6fa5;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: #1d6fa5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-green { background: #2a9d8f; }
        .btn-blue { background: #0077b6; }
        .btn-purple { background: #6a4c93; }
        .btn-dark { background: #14213d; }
        .btn-orange { background: #e76f51; }
        .btn-pdf { background: #c1121f; }
        
        input[type="file"] { display: none; }
        #status {
            margin: 10px 0;
            font-size: 13.5px;
            color: #222;
            white-space: pre-line;
            font-weight: 600;
            background: #eef4f8;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
        }
        #pdfInfoBox {
            display: none;
            margin: 10px 0;
            font-size: 13px;
            color: #14213d;
            background: #fff8e6;
            border-left: 4px solid #e76f51;
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            white-space: pre-line;
        }
        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 95px;
            margin-top: 5px;
            font-family: monospace;
            font-size: 13px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .actions { display: none; margin-top: 12px; }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-grid .btn { margin: 0; }
        
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #14213d;
            margin: 15px 0 8px 0;
            text-align: left;
            border-bottom: 2px solid #eef4f8;
            padding-bottom: 4px;
        }
        
        .setup-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .text-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #1d6fa5;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 4px;
            font-weight: bold;
        }
        .sat-box {
            background: #f8f5fd;
            border: 1px solid #d8c8f0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: left;
        }
        .sat-box label {
            font-size: 13px;
            font-weight: bold;
            color: #3d2661;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Конвертер ДЗК (JSON + PDF)</h2>
    
    <label class="btn btn-green" for="fileInput">📂 1. Обрати JSON файл координат</label>
    <input type="file" id="fileInput" accept=".json,application/json,*/*">

    <label class="btn btn-pdf" for="pdfInput">📄 2. Додати PDF довідку ДЗК (опція)</label>
    <input type="file" id="pdfInput" accept=".pdf,application/pdf">

    <div class="setup-box">
        <label style="font-size:13px; font-weight:bold;">Назва (Кадастровий № або ім'я файлу):</label>
        <input type="text" id="cadnumInput" class="text-input" placeholder="Автоматично з JSON / PDF або введіть..." style="margin-bottom:10px;">
        
        <label style="font-size:13px; font-weight:bold; display:block;">Система координат (за Datums.ini Digitals):</label>
        <select id="crsSelect" class="crs-select" style="margin-top:4px;">
            <option value="AUTO" selected>🌐 Автовизначення (СК-63 пріоритет)</option>
            <option value="SK63_1">📌 СК-63 Зона 1 (L0 = 23°30')</option>
            <option value="SK63_2">📌 СК-63 Зона 2 (L0 = 26°30')</option>
            <option value="SK63_3">📌 СК-63 Зона 3 (L0 = 29°30')</option>
            <option value="SK63_4">📌 СК-63 Зона 4 (L0 = 32°30')</option>
            <option value="SK63_5">📌 СК-63 Зона 5 (L0 = 35°30')</option>
            <option value="SK63_6">📌 СК-63 Зона 6 (L0 = 38°30')</option>
            <option value="MSK05">📌 МСК-05 Вінницька (L0 = 28°40')</option>
            <option value="MSK_AUTO">📌 МСК Інші області (за кад. номером)</option>
            <option value="USK2000">📌 УСК-2000 (Зони 4-7, 6-градусні)</option>
            <option value="VIN_LOCAL">📌 Місцева м. Вінниця [Местная(Vin)]</option>
        </select>
    </div>

    <div id="status">Очікування вибору файлу...</div>
    <div id="pdfInfoBox"></div>

    <div class="actions" id="actionButtons">
        <div class="btn-grid">
            <button class="btn btn-dark" id="shareTxtBtn">📄 Надіслати TXT</button>
            <button class="btn btn-orange" id="copyTxtBtn">📋 Копіювати TXT</button>
        </div>
        <div class="btn-grid">
            <button class="btn btn-green" id="shareSchemaBtn">🖼️ Біла Схема (JPG)</button>
            <button class="btn btn-blue" id="shareKmlBtn">🌍 KML (Earth)</button>
        </div>
        
        <div class="sat-box">
            <label>Картографічна підложка (Супутник / Гібрид / Карта):</label>
            <select id="mapSourceSelect" class="crs-select" style="margin-bottom:10px; border-color:#6a4c93; background-color:#ffffff;">
                <option value="arcgis_hybrid" selected>🛰️ ArcGIS Гібрид (Супутник + Вулиці/Села)</option>
                <option value="arcgis_sat">🛰️ ArcGIS Супутник (Чистий знімок)</option>
                <option value="google_hybrid">🌍 Google Гібрид (Супутник + Вулиці)</option>
                <option value="google_sat">🌍 Google Супутник (Чистий знімок)</option>
                <option value="osm">🗺️ OpenStreetMap (Карта вулиць і доріг)</option>
                <option value="opentopo">⛰️ OpenTopoMap (Топокарта з рельєфом)</option>
                <option value="carto_light">⬜ CartoDB Positron (Світла схема)</option>
            </select>

            <label>Масштаб знімка / карти:</label>
            <select id="zoomSelect" class="crs-select" style="margin-bottom:10px; border-color:#6a4c93; background-color:#ffffff;">
                <option value="20">🔍 ~1:200 (Макс. наближення, 20 zoom + Overzoom)</option>
                <option value="19">🔍 ~1:500 (Крупно, 19 zoom + Overzoom)</option>
                <option value="18">🔍 ~1:1000 (Ділянка, 18 zoom)</option>
                <option value="17" selected>🔍 ~1:2000 (Сусіди, 17 zoom)</option>
                <option value="16">🔍 ~1:4000 (Вулиця/Поле, 16 zoom)</option>
                <option value="15">🔍 ~1:8000 (Квартал/Масив, 15 zoom)</option>
                <option value="13">🔍 ~1:30000 (Село/Район, 13 zoom)</option>
            </select>

            <button class="btn btn-purple" id="shareSatBtn" style="margin-bottom:0;">🛰️ Згенерувати і Надіслати Карту (JPG)</button>
        </div>
    </div>

    <div id="displayArea" style="display: none; margin-top: 20px;">
        <div class="section-title">Каталог координат (№, X_Північ, Y_Схід, H):</div>
        <textarea id="txtPreview" readonly></textarea>

        <div class="section-title">Біла схема (з інфоблоком знизу):</div>
        <canvas id="plotCanvas" width="1200" height="1200"></canvas>
        
        <div id="satContainer" style="display: none;">
            <div class="section-title">Схема на підложці:</div>
            <canvas id="satCanvas" width="1200" height="1200"></canvas>
        </div>
    </div>
</div>

<script src="cordova.js"></script>
<script>
if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let currentTxtContent = "";
let currentSchemaBase64 = "";
let currentKmlContent = "";
let currentFileSafeName = "Dilyanka";
let currentDisplayLabel = "Dilyanka";
let currentWgs84Points = [];
let lastGeoJSON = null;
let lastUploadedFileName = "Dilyanka";
let parsedPdfMeta = null;

const canvas = document.getElementById('plotCanvas');
const ctx = canvas.getContext('2d');
const satCanvas = document.getElementById('satCanvas');
const satCtx = satCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const pdfInfoBox = document.getElementById('pdfInfoBox');
const displayArea = document.getElementById('displayArea');
const satContainer = document.getElementById('satContainer');
const cadnumInput = document.getElementById('cadnumInput');

// Точні осьові меридіани МСК України (з Datums.ini Digitals)
const mskMeridians = {
    '01': 34.0, '05': 28 + 40/60, '07': 25 + 20/60, '12': 34 + 50/60,
    '14': 37 + 50/60, '18': 28 + 30/60, '21': 23 + 30/60, '23': 35 + 25/60,
    '26': 24 + 45/60, '32': 30 + 30/60, '35': 32 + 25/60, '44': 39 + 10/60,
    '46': 24 + 00/60, '48': 32 + 00/60, '51': 30 + 20/60, '53': 34 + 15/60,
    '56': 26 + 30/60, '59': 34 + 20/60, '61': 25 + 40/60, '63': 36 + 25/60,
    '65': 33 + 30/60, '68': 27 + 00/60, '71': 31 + 30/60, '73': 25 + 50/60,
    '74': 31 + 50/60, '80': 30 + 30/60, '85': 33 + 30/60
};

function formatCadnum19(str) {
    let m = String(str).match(/\b(\d{10}):?(\d{2}):?(\d{3}):?(\d{4})\b/);
    if (m) return `${m[1]}:${m[2]}:${m[3]}:${m[4]}`;
    return null;
}

// 1. Завантаження JSON
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    lastUploadedFileName = file.name.replace(/\.json$/i, "").trim();

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            lastGeoJSON = JSON.parse(evt.target.result);
            satContainer.style.display = "none";
            processGeoJSON(lastGeoJSON, true);
        } catch (err) {
            statusEl.innerText = "❌ Помилка читання JSON: " + err.message;
        }
    };
    reader.readAsText(file);
});

// 2. Завантаження PDF довідки ДЗК
document.getElementById('pdfInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    let nameCad = formatCadnum19(file.name);
    if (nameCad) {
        cadnumInput.value = nameCad;
    }

    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageStr = textContent.items.map(item => item.str).join(" ");
            fullText += pageStr + "\n";
        }

        parseDzkPdfText(fullText, nameCad);

        if (lastGeoJSON) {
            processGeoJSON(lastGeoJSON, false);
        } else {
            statusEl.innerText = "✅ PDF прочитано! Тепер оберіть JSON файл координат.";
        }
    } catch (err) {
        if (nameCad) {
            parsedPdfMeta = { cadnum: nameCad };
            pdfInfoBox.style.display = "block";
            pdfInfoBox.innerText = `📄 З назви PDF взято кадастровий №:\n${nameCad}`;
            if (lastGeoJSON) processGeoJSON(lastGeoJSON, false);
        } else {
            alert("Не вдалося прочитати PDF: " + err.message);
        }
    }
});

function parseDzkPdfText(text, fallbackCad) {
    const clean = text.replace(/\s+/g, " ");

    let cadMatch = clean.match(/\b\d{10}:\d{2}:\d{3}:\d{4}\b/);
    let cadnum = cadMatch ? cadMatch[0] : (fallbackCad || "");

    let areaMatch = clean.match(/Площа земельної ділянки\s+([0-9.,]+)/i);
    let area = areaMatch ? areaMatch[1] : "";

    let purposeMatch = clean.match(/Цільове призначення\s+(.+?)\s+Категорія земель/i);
    let purpose = purposeMatch ? purposeMatch[1].trim() : "";

    let locMatch = clean.match(/Місце розташування\s+(.+?)\s+(?:Інформація про документацію|Відомості про|Технічна документація|Проект землеустрою)/i);
    let location = locMatch ? locMatch[1].trim() : "";

    let ownerMatch = clean.match(/Прізвище,\s*ім'я та по батькові фізичної особи\s+([А-ЯІЇЄҐA-Z'\-\s]+?)\s+(?:Дата державної|Номер запису|Частка|Форма власності)/i);
    let owner = ownerMatch ? ownerMatch[1].trim() : "";

    let tenantMatch = clean.match(/Найменування юридичної особи\s+(.+?)\s+Код ЄДРПОУ/i);
    let tenant = tenantMatch ? tenantMatch[1].trim() : "";

    let edrpouMatch = clean.match(/Код ЄДРПОУ юридичної особи\s+(\d{8,10})/i);
    let edrpou = edrpouMatch ? edrpouMatch[1].trim() : "";

    parsedPdfMeta = { cadnum, area, purpose, location, owner, tenant, edrpou };

    if (cadnum) {
        cadnumInput.value = cadnum;
    }

    let infoLines = [];
    if (cadnum) infoLines.push(`📌 Кадастровий №: ${cadnum}`);
    if (area) infoLines.push(`📐 Площа за PDF: ${area} га`);
    if (owner) infoLines.push(`👤 Власник: ${owner}`);
    if (tenant) infoLines.push(`🚜 Орендар: ${tenant}${edrpou ? ' (' + edrpou + ')' : ''}`);
    if (purpose) infoLines.push(`🌾 Цільове: ${purpose}`);
    if (location) infoLines.push(`📍 Адреса: ${location}`);

    pdfInfoBox.style.display = "block";
    pdfInfoBox.innerText = infoLines.join("\n");
}

document.getElementById('crsSelect').addEventListener('change', function() {
    if (lastGeoJSON) {
        satContainer.style.display = "none";
        processGeoJSON(lastGeoJSON, false);
    }
});

cadnumInput.addEventListener('input', function() {
    if (lastGeoJSON) processGeoJSON(lastGeoJSON, false);
});

function extractGeoData(data) {
    let cadnum = "";
    let coords = null;
    
    if (data.type === "FeatureCollection" && data.features && data.features.length > 0) {
        let props = data.features[0].properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "";
        coords = data.features[0].geometry.coordinates;
    } else if (data.type === "Feature") {
        let props = data.properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "";
        coords = data.geometry.coordinates;
    } else {
        let props = data.properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "";
        coords = data.coordinates;
    }

    let points = coords;
    while (points && points.length > 0 && Array.isArray(points[0]) && Array.isArray(points[0][0]) && Array.isArray(points[0][0][0])) points = points[0];
    if (points && points.length > 0 && Array.isArray(points[0]) && Array.isArray(points[0][0])) points = points[0];
    
    return { cadnum: String(cadnum).trim(), points };
}

function normalizePointEN(pt) {
    let a = Number(pt[0]);
    let b = Number(pt[1]);
    if (a >= 4800000 && a <= 5950000 && (b < 4800000 || b > 6000000)) {
        return { eastY: b, northX: a };
    }
    return { eastY: a, northX: b };
}

function calcPolygonAreaHa(pts) {
    let sum = 0;
    for (let i = 0; i < pts.length; i++) {
        let p1 = pts[i];
        let p2 = pts[(i + 1) % pts.length];
        sum += (p1.eastY * p2.northX - p2.eastY * p1.northX);
    }
    return Math.abs(sum) / 2.0 / 10000.0;
}

function wrapCanvasText(context, text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0] || "";

    for (let i = 1; i < words.length; i++) {
        let word = words[i];
        let width = context.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
            currentLine += " " + word;
        } else {
            lines.push(currentLine);
            currentLine = word;
        }
    }
    if (currentLine) lines.push(currentLine);
    return lines;
}

function processGeoJSON(data, isNewFile) {
    let extracted = extractGeoData(data);
    let rawPoints = extracted.points;

    if (!rawPoints || rawPoints.length < 3) {
        statusEl.innerText = "❌ Не знайдено координат ділянки у файлі.";
        return;
    }

    if (isNewFile) {
        if (extracted.cadnum && extracted.cadnum !== "unknown" && extracted.cadnum !== "") {
            cadnumInput.value = extracted.cadnum;
        } else if (parsedPdfMeta && parsedPdfMeta.cadnum) {
            cadnumInput.value = parsedPdfMeta.cadnum;
        } else {
            let fromFileName = formatCadnum19(lastUploadedFileName);
            cadnumInput.value = fromFileName || lastUploadedFileName || "Dilyanka";
        }
    }

    currentDisplayLabel = cadnumInput.value.trim() || "Dilyanka";
    currentFileSafeName = currentDisplayLabel.replace(/:/g, "").replace(/[\\/*?"<>|]/g, "_");

    let normPts = rawPoints.map(normalizePointEN);
    if (normPts.length > 1) {
        const first = normPts[0], last = normPts[normPts.length - 1];
        if (Math.abs(first.eastY - last.eastY) < 0.001 && Math.abs(first.northX - last.northX) < 0.001) {
            normPts = normPts.slice(0, -1);
        }
    }

    const calcAreaHa = calcPolygonAreaHa(normPts);

    // 1. Формуємо TXT (Номер, X_Північ, Y_Схід, 0)
    let txtLines = [];
    normPts.forEach((pt, idx) => {
        txtLines.push(`${idx + 1},${pt.northX.toFixed(2)},${pt.eastY.toFixed(2)},0`);
    });
    currentTxtContent = txtLines.join("\r\n") + "\r\n";
    document.getElementById('txtPreview').value = currentTxtContent;

    // 2. Перерахунок у WGS84 точно за Datums.ini Digitals
    let mode = document.getElementById('crsSelect').value;
    currentWgs84Points = [];

    if (typeof proj4 !== 'undefined') {
        try {
            let firstE = normPts[0].eastY;
            let firstN = normPts[0].northX;

            let effectiveMode = mode;
            if (mode === "AUTO") {
                if (firstN < 100000 && firstE < 100000) {
                    effectiveMode = "VIN_LOCAL";
                } else {
                    let z = Math.floor(firstE / 1000000);
                    if (z >= 1 && z <= 6) {
                        effectiveMode = "SK63_" + z;
                    } else {
                        let cleanDigits = currentDisplayLabel.replace(/\D/g, "");
                        let reg = cleanDigits.length >= 2 ? cleanDigits.substring(0, 2) : "05";
                        effectiveMode = (reg === "05") ? "MSK05" : "MSK_AUTO";
                    }
                }
            }

            const helmertDigitals = "25,-141,-78.5,0,0.35,0.736,0";
            let L0 = 29.5;
            let falseEast = 3300000;
            let falseNorth = -9214.688;
            let sysInfo = "";

            if (effectiveMode.startsWith("SK63_")) {
                let z = parseInt(effectiveMode.split("_")[1]);
                L0 = 20.5 + 3.0 * z;
                let hasZone = Math.floor(firstE / 1000000) === z;
                falseEast = (hasZone ? z * 1000000 : 0) + 300000;
                falseNorth = -9214.688;
                sysInfo = `СК-63 Зона ${z} (L0=${L0}°)`;
            } 
            else if (effectiveMode === "MSK05") {
                L0 = 28 + 40/60;
                let zPref = Math.floor(firstE / 1000000);
                falseEast = (zPref > 0 ? zPref * 1000000 : 0) + 300000;
                falseNorth = 0;
                sysInfo = `МСК-05 Вінницька (L0=28°40')`;
            } 
            else if (effectiveMode === "MSK_AUTO") {
                let cleanDigits = currentDisplayLabel.replace(/\D/g, "");
                let reg = cleanDigits.length >= 2 ? cleanDigits.substring(0, 2) : "05";
                L0 = mskMeridians[reg] || (28 + 40/60);
                let zPref = Math.floor(firstE / 1000000);
                falseEast = (zPref > 0 ? zPref * 1000000 : 0) + 300000;
                falseNorth = 0;
                sysInfo = `МСК-${reg} (L0=${L0.toFixed(4)}°)`;
            } 
            else if (effectiveMode === "USK2000") {
                let z = Math.floor(firstE / 1000000);
                if (z < 4 || z > 7) z = 5;
                L0 = 6.0 * z - 3.0;
                let hasZone = Math.floor(firstE / 1000000) === z;
                falseEast = (hasZone ? z * 1000000 : 0) + 500000;
                falseNorth = 0;
                sysInfo = `УСК-2000 Зона ${z} (L0=${L0}°)`;
            } 
            else if (effectiveMode === "VIN_LOCAL") {
                L0 = 29.5;
                falseEast = 3300000;
                falseNorth = -9214.688;
                sysInfo = `Місцева м. Вінниця -> СК-63(3)`;
            }

            let projFrom = `+proj=tmerc +lat_0=0 +lon_0=${L0} +k=1 +x_0=${falseEast} +y_0=${falseNorth} +a=6378245 +rf=298.3 +towgs84=${helmertDigitals} +units=m +no_defs`;
            let projTo = "+proj=longlat +datum=WGS84 +no_defs";
            
            let kmlCoords = "";
            normPts.forEach(pt => {
                let eY = pt.eastY;
                let nX = pt.northX;
                if (effectiveMode === "VIN_LOCAL") {
                    nX += 5405692.6;
                    eY += 3207213.4;
                }
                let coords = proj4(projFrom, projTo, [eY, nX]);
                currentWgs84Points.push({lon: coords[0], lat: coords[1]});
                kmlCoords += `${coords[0].toFixed(7)},${coords[1].toFixed(7)},0 `;
            });
            let firstPt = currentWgs84Points[0];
            kmlCoords += `${firstPt.lon.toFixed(7)},${firstPt.lat.toFixed(7)},0`;

            const cLon = currentWgs84Points.reduce((s, p) => s + p.lon, 0) / currentWgs84Points.length;
            const cLat = currentWgs84Points.reduce((s, p) => s + p.lat, 0) / currentWgs84Points.length;

            let kmlDesc = `Площа за координатами: ${calcAreaHa.toFixed(4)} га`;
            if (parsedPdfMeta) {
                if (parsedPdfMeta.area) kmlDesc += `\nПлоща за ДЗК: ${parsedPdfMeta.area} га`;
                if (parsedPdfMeta.owner) kmlDesc += `\nВласник: ${parsedPdfMeta.owner}`;
                if (parsedPdfMeta.tenant) kmlDesc += `\nОрендар: ${parsedPdfMeta.tenant}`;
                if (parsedPdfMeta.purpose) kmlDesc += `\nЦільове: ${parsedPdfMeta.purpose}`;
                if (parsedPdfMeta.location) kmlDesc += `\nАдреса: ${parsedPdfMeta.location}`;
            }

            currentKmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${currentDisplayLabel}</name>
    <Style id="polyStyle">
      <LineStyle><color>ff0055ff</color><width>3</width></LineStyle>
      <PolyStyle><color>4d0055ff</color></PolyStyle>
    </Style>
    <Placemark>
      <name>${currentDisplayLabel}</name>
      <description><![CDATA[${kmlDesc.replace(/\n/g, '<br/>')}]]></description>
      <styleUrl>#polyStyle</styleUrl>
      <Polygon>
        <outerBoundaryIs><LinearRing><coordinates>${kmlCoords}</coordinates></LinearRing></outerBoundaryIs>
      </Polygon>
    </Placemark>
  </Document>
</kml>`;
            
            statusEl.innerText = `✅ Назва: ${currentDisplayLabel}\n📐 Площа (коорд.): ${calcAreaHa.toFixed(4)} га | Точок: ${normPts.length}\n⚙️ ${sysInfo}\n📍 Центр WGS84: ${cLat.toFixed(6)}, ${cLon.toFixed(6)}`;
        } catch (e) {
            statusEl.innerText = "⚠️ Помилка перерахунку: " + e.message;
        }
    }

    // 3. Малюємо Білу Схему (JPG) з окремим інфоблоком знизу
    const width = 1200;
    const plotAreaHeight = 960;
    const plotPad = 120;

    let rawDetailLines = [];
    if (parsedPdfMeta) {
        let areaLine = `Площа: ${ parsedPdfMeta.area ? parsedPdfMeta.area + ' га (за ДЗК) / ' : '' }${calcAreaHa.toFixed(4)} га (за коорд.)`;
        rawDetailLines.push(areaLine);
        if (parsedPdfMeta.owner) rawDetailLines.push(`Власник: ${parsedPdfMeta.owner}`);
        if (parsedPdfMeta.tenant) {
            rawDetailLines.push(`Орендар: ${parsedPdfMeta.tenant}${parsedPdfMeta.edrpou ? ' (ЄДРПОУ ' + parsedPdfMeta.edrpou + ')' : ''}`);
        }
        if (parsedPdfMeta.purpose) rawDetailLines.push(`Цільове: ${parsedPdfMeta.purpose}`);
        if (parsedPdfMeta.location) rawDetailLines.push(`Адреса: ${parsedPdfMeta.location}`);
    } else {
        rawDetailLines.push(`Площа за координатами: ${calcAreaHa.toFixed(4)} га | Кількість точок: ${normPts.length}`);
    }

    ctx.font = "22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
    let wrappedDetails = [];
    const maxTextWidth = width - 120;
    rawDetailLines.forEach(line => {
        let subLines = wrapCanvasText(ctx, line, maxTextWidth);
        wrappedDetails.push(...subLines);
    });

    const lineHeight = 32;
    const footerBlockHeight = Math.max(160, 85 + wrappedDetails.length * lineHeight + 35);
    const totalHeight = plotAreaHeight + footerBlockHeight;

    canvas.width = width;
    canvas.height = totalHeight;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, totalHeight);

    const ys = normPts.map(p => p.eastY), xs = normPts.map(p => p.northX);
    const minY = Math.min(...ys), maxY = Math.max(...ys), minX = Math.min(...xs), maxX = Math.max(...xs);
    const spanY = Math.max(maxY - minY, 0.001), spanX = Math.max(maxX - minX, 0.001);
    const availW = width - 2 * plotPad;
    const availH = plotAreaHeight - 2 * plotPad;
    const scale = Math.min(availW / spanY, availH / spanX);

    const offsetX = (width - spanY * scale) / 2;
    const offsetY = (plotAreaHeight - spanX * scale) / 2;

    const pxPts = normPts.map(p => ({
        x: offsetX + (p.eastY - minY) * scale,
        y: plotAreaHeight - (offsetY + (p.northX - minX) * scale)
    }));

    ctx.beginPath();
    ctx.moveTo(pxPts[0].x, pxPts[0].y);
    for (let i = 1; i < pxPts.length; i++) ctx.lineTo(pxPts[i].x, pxPts[i].y);
    ctx.closePath();
    ctx.strokeStyle = "#14213d";
    ctx.lineWidth = 4;
    ctx.stroke();

    const centerX = pxPts.reduce((s, p) => s + p.x, 0) / pxPts.length;
    const centerY = pxPts.reduce((s, p) => s + p.y, 0) / pxPts.length;

    pxPts.forEach((pt, idx) => {
        const s = 7;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(pt.x - s, pt.y - s, s * 2, s * 2);
        ctx.strokeStyle = "#14213d";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(pt.x - s, pt.y - s, s * 2, s * 2);

        const dx = pt.x - centerX, dy = pt.y - centerY;
        const dist = Math.max(Math.hypot(dx, dy), 1);
        ctx.fillStyle = "#000000";
        ctx.font = "25px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(idx + 1), pt.x + (dx / dist) * 32, pt.y + (dy / dist) * 32);
    });

    ctx.beginPath();
    ctx.moveTo(60, plotAreaHeight);
    ctx.lineTo(width - 60, plotAreaHeight);
    ctx.strokeStyle = "#cccccc";
    ctx.lineWidth = 2;
    ctx.stroke();

    let textY = plotAreaHeight + 42;
    ctx.fillStyle = "#000000";
    ctx.font = "bold 32px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(currentDisplayLabel, width / 2, textY);

    textY += 44;
    ctx.fillStyle = "#222222";
    ctx.font = "22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
    wrappedDetails.forEach(line => {
        ctx.fillText(line, width / 2, textY);
        textY += lineHeight;
    });

    currentSchemaBase64 = canvas.toDataURL("image/jpeg", 0.95).split(',')[1];
    displayArea.style.display = "block";
    document.getElementById('actionButtons').style.display = "block";
}

// === ЛОГІКА КАРТОГРАФІЧНИХ ПІДЛОЖОК ТА СУПУТНИКА (З ПІДТРИМКОЮ ГІБРИДА ТА OVERZOOM ДО 1:200) ===
function lon2tileX(lon, zoom) { return ((lon + 180) / 360) * Math.pow(2, zoom); }
function lat2tileY(lat, zoom) { return ((1 - Math.log(Math.tan(lat * Math.PI/180) + 1 / Math.cos(lat * Math.PI/180)) / Math.PI) / 2) * Math.pow(2, zoom); }

// Формування URL для обраного провайдера карт
function getTileUrl(provider, z, x, y) {
    switch (provider) {
        case 'arcgis_sat':
        case 'arcgis_hybrid':
            return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
        case 'arcgis_labels':
            return `https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/${z}/${y}/${x}`;
        case 'arcgis_roads':
            return `https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/${z}/${y}/${x}`;
        case 'google_hybrid':
            return `https://mt1.google.com/vt/lyrs=y&hl=uk&x=${x}&y=${y}&z=${z}`;
        case 'google_sat':
            return `https://mt1.google.com/vt/lyrs=s&hl=uk&x=${x}&y=${y}&z=${z}`;
        case 'osm':
            return `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
        case 'opentopo':
            return `https://tile.opentopomap.org/${z}/${x}/${y}.png`;
        case 'carto_light':
            return `https://a.basemaps.cartocdn.com/light_all/${z}/${x}/${y}.png`;
        default:
            return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
    }
}

// Максимальний нативний зум для кожного джерела (вище нього автоматично вмикається Overzoom або перевірка заглушки)
function getMaxNativeZoom(provider) {
    if (provider === 'opentopo') return 17;
    if (provider === 'osm') return 19;
    return 20;
}

// Перевірка, чи є супутниковий тайл сірою заглушкою ("Map data not yet available")
function isPlaceholderTile(img, provider) {
    // Перевіряємо тільки супутникові шари (бо векторні карти самі по собі світло-сірі)
    if (!provider.includes('arcgis') && !provider.includes('google')) return false;
    try {
        const testCanvas = document.createElement('canvas');
        testCanvas.width = 64;
        testCanvas.height = 64;
        const tCtx = testCanvas.getContext('2d');
        tCtx.drawImage(img, 0, 0, 64, 64);
        const data = tCtx.getImageData(0, 0, 64, 64).data;

        let colorDiffSum = 0;
        let brightCount = 0;
        const totalPixels = 64 * 64;

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            colorDiffSum += Math.abs(r - g) + Math.abs(g - b) + Math.abs(r - b);
            if (r > 195 && g > 195 && b > 195) brightCount++;
        }
        const avgColorDiff = colorDiffSum / totalPixels;
        // Якщо тайл повністю сірий (без кольорів природи) і світлий — це заглушка відсутності знімка
        return (avgColorDiff < 2.8 && (brightCount / totalPixels) > 0.78);
    } catch (e) {
        return false;
    }
}

function loadRawTile(provider, z, x, y, checkPlaceholder = true) {
    return new Promise((resolve) => {
        let img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            if (checkPlaceholder && isPlaceholderTile(img, provider)) {
                resolve(null);
            } else {
                resolve(img);
            }
        };
        img.onerror = () => resolve(null);
        img.src = getTileUrl(provider, z, x, y);
    });
}

// Завантаження тайла з автоматичним Overzoom (спускається до нижчого зуму, якщо на 19/20 немає даних, і вирізає потрібний квадрат)
async function loadSmartTile(provider, targetZ, targetX, targetY, isOverlay = false) {
    const startZ = Math.min(targetZ, getMaxNativeZoom(provider));
    const minFallbackZ = isOverlay ? Math.max(13, targetZ - 3) : 14;

    for (let z = startZ; z >= minFallbackZ; z--) {
        const scaleDiff = Math.pow(2, targetZ - z);
        const parentX = Math.floor(targetX / scaleDiff);
        const parentY = Math.floor(targetY / scaleDiff);

        const img = await loadRawTile(provider, z, parentX, parentY, !isOverlay);
        if (img) {
            const subSize = 256 / scaleDiff;
            const srcX = (targetX % scaleDiff) * subSize;
            const srcY = (targetY % scaleDiff) * subSize;
            return {
                img: img,
                x: targetX,
                y: targetY,
                srcX: srcX,
                srcY: srcY,
                srcW: subSize,
                srcH: subSize,
                actualZoom: z
            };
        }
    }
    return null;
}

document.getElementById('shareSatBtn').onclick = async function() {
    if (currentWgs84Points.length === 0) {
        alert("Неможливо згенерувати карту: помилка координат.");
        return;
    }
    const provider = document.getElementById('mapSourceSelect').value;
    const zoom = parseInt(document.getElementById('zoomSelect').value);
    const baseStatus = statusEl.innerText.split('\n✅ Карту')[0];
    statusEl.innerText = "⏳ Завантаження тайлів підложки та генерація схеми...";
    this.disabled = true;

    try {
        const cLon = currentWgs84Points.reduce((s, p) => s + p.lon, 0) / currentWgs84Points.length;
        const cLat = currentWgs84Points.reduce((s, p) => s + p.lat, 0) / currentWgs84Points.length;
        const cTileX = lon2tileX(cLon, zoom);
        const cTileY = lat2tileY(cLat, zoom);
        
        const size = 1200; const halfSize = size / 2;
        const minTX = Math.floor((cTileX * 256 - halfSize) / 256);
        const maxTX = Math.floor((cTileX * 256 + halfSize) / 256);
        const minTY = Math.floor((cTileY * 256 - halfSize) / 256);
        const maxTY = Math.floor((cTileY * 256 + halfSize) / 256);

        let basePromises = [];
        let roadPromises = [];
        let labelPromises = [];

        for (let tx = minTX; tx <= maxTX; tx++) {
            for (let ty = minTY; ty <= maxTY; ty++) {
                basePromises.push(loadSmartTile(provider, zoom, tx, ty, false));
                // Якщо обрано Гібрид ArcGIS — підтягуємо прозорі шари доріг/вулиць та назв населених пунктів
                if (provider === 'arcgis_hybrid') {
                    roadPromises.push(loadSmartTile('arcgis_roads', zoom, tx, ty, true));
                    labelPromises.push(loadSmartTile('arcgis_labels', zoom, tx, ty, true));
                }
            }
        }

        const baseTiles = await Promise.all(basePromises);
        const roadTiles = provider === 'arcgis_hybrid' ? await Promise.all(roadPromises) : [];
        const labelTiles = provider === 'arcgis_hybrid' ? await Promise.all(labelPromises) : [];
        
        satCtx.fillStyle = "#1e1e1e";
        satCtx.fillRect(0, 0, size, size);
        satCtx.imageSmoothingEnabled = true;
        satCtx.imageSmoothingQuality = "high";

        let usedActualZoom = zoom;
        let loadedCount = 0;

        // 1. Малюємо базовий шар (супутник або карту)
        baseTiles.forEach(t => {
            if (t) {
                loadedCount++;
                if (t.actualZoom < usedActualZoom) usedActualZoom = t.actualZoom;
                let pxX = (t.x * 256) - (cTileX * 256 - halfSize);
                let pxY = (t.y * 256) - (cTileY * 256 - halfSize);
                satCtx.drawImage(t.img, t.srcX, t.srcY, t.srcW, t.srcH, pxX, pxY, 256, 256);
            }
        });

        // 2. Якщо ArcGIS Гібрид — накладаємо вулиці/дороги та підписи населених пунктів
        roadTiles.forEach(t => {
            if (t) {
                let pxX = (t.x * 256) - (cTileX * 256 - halfSize);
                let pxY = (t.y * 256) - (cTileY * 256 - halfSize);
                satCtx.drawImage(t.img, t.srcX, t.srcY, t.srcW, t.srcH, pxX, pxY, 256, 256);
            }
        });
        labelTiles.forEach(t => {
            if (t) {
                let pxX = (t.x * 256) - (cTileX * 256 - halfSize);
                let pxY = (t.y * 256) - (cTileY * 256 - halfSize);
                satCtx.drawImage(t.img, t.srcX, t.srcY, t.srcW, t.srcH, pxX, pxY, 256, 256);
            }
        });

        // 3. Малюємо контур ділянки та точки
        let satPts = currentWgs84Points.map(p => {
            return {
                x: (lon2tileX(p.lon, zoom) * 256) - (cTileX * 256 - halfSize),
                y: (lat2tileY(p.lat, zoom) * 256) - (cTileY * 256 - halfSize)
            };
        });

        satCtx.beginPath();
        satCtx.moveTo(satPts[0].x, satPts[0].y);
        for (let i = 1; i < satPts.length; i++) satCtx.lineTo(satPts[i].x, satPts[i].y);
        satCtx.closePath();

        satCtx.fillStyle = "rgba(255, 0, 0, 0.22)"; satCtx.fill();
        satCtx.strokeStyle = "#ff0000"; satCtx.lineWidth = 4; satCtx.stroke();

        // Точки та номери
        const polyCenterX = satPts.reduce((s, p) => s + p.x, 0) / satPts.length;
        const polyCenterY = satPts.reduce((s, p) => s + p.y, 0) / satPts.length;

        satCtx.font = "bold 25px 'Courier New', monospace";
        satCtx.textAlign = "center"; satCtx.textBaseline = "middle";

        satPts.forEach((pt, idx) => {
            const s = 6;
            satCtx.fillStyle = "#ffffff"; satCtx.fillRect(pt.x - s, pt.y - s, s * 2, s * 2);
            satCtx.strokeStyle = "#ff0000"; satCtx.lineWidth = 2; satCtx.strokeRect(pt.x - s, pt.y - s, s * 2, s * 2);
            const dx = pt.x - polyCenterX, dy = pt.y - polyCenterY;
            const dist = Math.max(Math.hypot(dx, dy), 1);
            const tx = pt.x + (dx/dist)*32, ty = pt.y + (dy/dist)*32;
            satCtx.lineWidth = 4; satCtx.strokeStyle = "#ffffff"; satCtx.strokeText(String(idx + 1), tx, ty);
            satCtx.fillStyle = "#000000"; satCtx.fillText(String(idx + 1), tx, ty);
        });

        // Плашка знизу з кадастровим номером
        satCtx.fillStyle = "rgba(20, 33, 61, 0.85)";
        satCtx.fillRect(0, size - 70, size, 70);
        satCtx.font = "bold 30px 'Courier New', monospace";
        satCtx.fillStyle = "#ffffff";
        satCtx.fillText(currentDisplayLabel, halfSize, size - 35);

        let b64 = satCanvas.toDataURL("image/jpeg", 0.92).split(',')[1];
        satContainer.style.display = "block";
        
        let zoomNote = (usedActualZoom < zoom) ? ` (Overzoom з ${usedActualZoom} до ${zoom} рівня)` : ` (Рівень ${zoom})`;
        statusEl.innerText = baseStatus + `\n✅ Карту згенеровано!${zoomNote}`;

        shareNative(b64, "_Map.jpg", "image/jpeg");

    } catch (e) {
        statusEl.innerText = "❌ Помилка генерації карти: " + e.message;
    } finally {
        this.disabled = false;
    }
};

// === ЕКСПОРТ ЧЕРЕЗ НАТИВНЕ МЕНЮ ANDROID ===
function utf8ToBase64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

function shareNative(base64Data, extension, mimeType) {
    const dataUrl = `df:${currentFileSafeName}${extension};data:${mimeType};base64,` + base64Data;
    if (window.plugins && window.plugins.socialsharing) {
        window.plugins.socialsharing.shareWithOptions({
            subject: currentFileSafeName + extension,
            files: [dataUrl]
        });
    } else {
        fallbackShare(base64Data, extension, mimeType);
    }
}

document.getElementById('shareTxtBtn').onclick = function() { shareNative(utf8ToBase64(currentTxtContent), ".txt", "text/plain"); };
document.getElementById('shareSchemaBtn').onclick = function() { shareNative(currentSchemaBase64, ".jpg", "image/jpeg"); };
document.getElementById('shareKmlBtn').onclick = function() {
    if (!currentKmlContent) return;
    shareNative(utf8ToBase64(currentKmlContent), ".kml", "application/vnd.google-earth.kml+xml");
};
document.getElementById('copyTxtBtn').onclick = function() {
    const txtArea = document.getElementById('txtPreview');
    txtArea.select(); document.execCommand('copy');
    statusEl.innerText += "\n✅ Координати скопійовано в буфер!";
};

function fallbackShare(base64Data, ext, mimeType) {
    let binStr = atob(base64Data);
    const byteNumbers = new Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) byteNumbers[i] = binStr.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], {type: mimeType});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentFileSafeName + ext;
    a.click();
}
