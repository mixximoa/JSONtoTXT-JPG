<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кадастр JSON -> TXT / JPG / KML</title>
    <!-- Геодезична бібліотека Proj4js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            color: #14213d;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; font-size: 19px; color: #14213d; }
        
        .crs-select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #14213d;
            background-color: #eef4f8;
            border: 2px solid #1d6fa5;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: #1d6fa5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-green { background: #2a9d8f; }
        .btn-blue { background: #0077b6; }
        .btn-purple { background: #6a4c93; }
        .btn-dark { background: #14213d; }
        .btn-orange { background: #e76f51; }
        
        input[type="file"] { display: none; }
        #status {
            margin: 10px 0;
            font-size: 14px;
            color: #222;
            white-space: pre-line;
            font-weight: 600;
            background: #eef4f8;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
        }
        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 90px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: none;
        }
        .actions { display: none; margin-top: 12px; }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-grid .btn { margin: 0; }
        
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #14213d;
            margin: 15px 0 8px 0;
            text-align: left;
            border-bottom: 2px solid #eef4f8;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Кадастр (RTK + Супутник + Google Earth)</h2>
    
    <select id="crsSelect" class="crs-select">
        <option value="SC63" selected>🌐 Система: СК-63 (Основна для ДЗК)</option>
        <option value="MSK">📌 МСК (Місцева за кадастровим номером)</option>
        <option value="USK2000">📌 УСК-2000 (Зона за координатою Y)</option>
    </select>
    
    <label class="btn" for="fileInput">📂 1. Обрати JSON файл кадастру</label>
    <input type="file" id="fileInput" accept="*/*">

    <div id="status">Очікування вибору файлу...</div>

    <div class="actions" id="actionButtons">
        <div class="btn-grid">
            <button class="btn btn-dark" id="shareTxtBtn">📄 Надіслати TXT</button>
            <button class="btn btn-orange" id="copyTxtBtn">📋 Копіювати TXT</button>
        </div>
        <div class="btn-grid">
            <button class="btn btn-green" id="shareSchemaBtn">🖼️ Біла Схема (JPG)</button>
            <button class="btn btn-blue" id="shareKmlBtn">🌍 KML (Earth)</button>
        </div>
        
        <hr style="margin:15px 0; border:0; border-top:1px solid #ddd;">
        
        <select id="zoomSelect" class="crs-select" style="margin-bottom:8px; border-color:#6a4c93; background-color:#f8f5fd;">
            <option value="19">🛰️ Супутник: ~1:500 (Крупно)</option>
            <option value="17">🛰️ Супутник: ~1:2000 (Сусіди)</option>
            <option value="15" selected>🛰️ Супутник: ~1:8000 (Квартал)</option>
            <option value="13">🛰️ Супутник: ~1:30000 (Село/Район)</option>
        </select>
        <button class="btn btn-purple" id="shareSatBtn">🛰️ Згенерувати і Надіслати Супутник</button>
    </div>

    <!-- Блок відображення -->
    <div id="displayArea" style="display: none; margin-top: 20px;">
        <div class="section-title">Каталог координат:</div>
        <textarea id="txtPreview" readonly></textarea>

        <div class="section-title">Біла схема:</div>
        <canvas id="plotCanvas" width="1200" height="1200"></canvas>
        
        <div id="satContainer" style="display: none;">
            <div class="section-title">Супутникова схема:</div>
            <canvas id="satCanvas" width="1200" height="1200"></canvas>
        </div>
    </div>
</div>

<script src="cordova.js"></script>
<script>
let currentTxtContent = "";
let currentSchemaBase64 = "";
let currentKmlContent = "";
let currentBaseName = "unknown";
let currentWgs84Points = [];
let lastGeoJSON = null;

const canvas = document.getElementById('plotCanvas');
const ctx = canvas.getContext('2d');
const satCanvas = document.getElementById('satCanvas');
const satCtx = satCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const displayArea = document.getElementById('displayArea');
const satContainer = document.getElementById('satContainer');

// Словник осьових меридіанів МСК
const mskL0 = {
    '01':34.5, '05':28.5, '07':25.5, '12':34.5, '14':37.5,
    '18':28.5, '21':22.5, '23':34.5, '26':25.5, '32':31.5,
    '35':31.5, '44':39.0, '46':22.5, '48':31.5, '51':31.5,
    '53':34.5, '56':25.5, '59':34.5, '61':25.5, '63':34.5,
    '65':34.5, '68':25.5, '71':31.5, '73':25.5, '74':31.5,
    '80':31.5, '85':34.5
};

document.getElementById('crsSelect').addEventListener('change', function() {
    if (lastGeoJSON) processGeoJSON(lastGeoJSON);
});

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            lastGeoJSON = JSON.parse(evt.target.result);
            satContainer.style.display = "none"; 
            processGeoJSON(lastGeoJSON);
        } catch (err) {
            statusEl.innerText = "❌ Помилка читання JSON: " + err.message;
        }
    };
    reader.readAsText(file);
});

function extractGeoData(data) {
    let cadnum = "unknown";
    let coords = null;
    
    if (data.type === "FeatureCollection" && data.features && data.features.length > 0) {
        let props = data.features[0].properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "unknown";
        coords = data.features[0].geometry.coordinates;
    } else if (data.type === "Feature") {
        let props = data.properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "unknown";
        coords = data.geometry.coordinates;
    } else {
        let props = data.properties || {};
        cadnum = props.cadnum || props.cadNum || props.cad_num || props.kad_nom || "unknown";
        coords = data.coordinates;
    }

    let points = coords;
    while (points && points.length > 0 && Array.isArray(points[0]) && Array.isArray(points[0][0]) && Array.isArray(points[0][0][0])) {
        points = points[0];
    }
    if (points && points.length > 0 && Array.isArray(points[0]) && Array.isArray(points[0][0])) {
        points = points[0];
    }
    return { cadnum, points };
}

function processGeoJSON(data) {
    let extracted = extractGeoData(data);
    let points = extracted.points;
    let cadnum = extracted.cadnum;

    if (!points || points.length < 3) {
        statusEl.innerText = "❌ Не знайдено координат ділянки у файлі.";
        return;
    }

    currentBaseName = cadnum.replace(/:/g, "");
    if (currentBaseName === "unknown") currentBaseName = "Dilyanka";

    if (points.length > 1) {
        const first = points[0], last = points[points.length - 1];
        if (first[0] === last[0] && first[1] === last[1]) points = points.slice(0, -1);
    }

    // 1. Формуємо TXT
    let txtLines = [];
    points.forEach((pt, idx) => {
        txtLines.push(`${idx + 1},${Number(pt[1]).toFixed(3)},${Number(pt[0]).toFixed(3)},0`);
    });
    currentTxtContent = txtLines.join("\r\n") + "\r\n";
    document.getElementById('txtPreview').value = currentTxtContent;
    document.getElementById('txtPreview').style.display = "block";

    // 2. Визначаємо систему координат (СК-63 за замовчуванням)
    let activeSys = document.getElementById('crsSelect').value;
    let regionCode = currentBaseName.substring(0, 2);

    currentWgs84Points = [];
    if (typeof proj4 !== 'undefined') {
        try {
            let firstY = Number(points[0][0]);
            let projFrom = "";
            let towgs84 = "24,-123,-94,0.02,-0.25,-0.13,1.1"; 
            let zone = Math.floor(firstY / 1000000);
            if (zone === 0) zone = 3; // Базовий запобіжник

            if (activeSys === "SC63") {
                // ПРАВИЛЬНА ФОРМУЛА ДЛЯ СК-63
                let L0 = 20.5 + 3.0 * zone;
                let falseEasting = zone * 1000000 + 500000;
                projFrom = `+proj=tmerc +lat_0=0 +lon_0=${L0} +k=1 +x_0=${falseEasting} +y_0=0 +ellps=krass +towgs84=${towgs84} +units=m +no_defs`;
                statusEl.innerText = `✅ Кад. номер: ${cadnum}\n⚙️ Система: СК-63 (Зона ${zone}, L0=${L0})`;
            } 
            else if (activeSys === "MSK") {
                let L0 = mskL0[regionCode] || 28.5;
                let falseEasting = (firstY > 1000000) ? Math.floor(firstY / 1000000) * 1000000 + 300000 : 300000;
                projFrom = `+proj=tmerc +lat_0=0 +lon_0=${L0} +k=1 +x_0=${falseEasting} +y_0=0 +ellps=krass +towgs84=${towgs84} +units=m +no_defs`;
                statusEl.innerText = `✅ Кад. номер: ${cadnum}\n⚙️ Система: МСК (Обл. ${regionCode}, L0=${L0})`;
            } 
            else if (activeSys === "USK2000") {
                let L0 = 21.0 + 3.0 * (zone - 1);
                let falseEasting = zone * 1000000 + 500000;
                projFrom = `+proj=tmerc +lat_0=0 +lon_0=${L0} +k=1 +x_0=${falseEasting} +y_0=0 +ellps=krass +towgs84=${towgs84} +units=m +no_defs`;
                statusEl.innerText = `✅ Кад. номер: ${cadnum}\n⚙️ Система: УСК-2000 (Зона ${zone}, L0=${L0})`;
            } 

            let projTo = "+proj=longlat +datum=WGS84 +no_defs";
            let kmlCoords = "";

            points.forEach(pt => {
                let coords = proj4(projFrom, projTo, [Number(pt[0]), Number(pt[1])]);
                currentWgs84Points.push({lon: coords[0], lat: coords[1]});
                kmlCoords += `${coords[0].toFixed(7)},${coords[1].toFixed(7)},0 `;
            });
            let firstPt = currentWgs84Points[0];
            kmlCoords += `${firstPt.lon.toFixed(7)},${firstPt.lat.toFixed(7)},0`;

            currentKmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document><name>${cadnum}</name><Placemark><name>${cadnum}</name>
  <Style><LineStyle><color>ff0000ff</color><width>3</width></LineStyle><PolyStyle><color>4d0000ff</color></PolyStyle></Style>
  <Polygon><outerBoundaryIs><LinearRing><coordinates>${kmlCoords}</coordinates></LinearRing></outerBoundaryIs></Polygon>
  </Placemark></Document></kml>`;
        } catch (e) {
            statusEl.innerText += "\n⚠️ Помилка координат: " + e.message;
        }
    }

    // 3. Малюємо Білу Схему
    const size = 1200, pad = 180;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, size, size);

    const ys = points.map(p => p[0]), xs = points.map(p => p[1]);
    const minY = Math.min(...ys), maxY = Math.max(...ys), minX = Math.min(...xs), maxX = Math.max(...xs);
    const spanY = Math.max(maxY - minY, 0.001), spanX = Math.max(maxX - minX, 0.001);
    const scale = (size - 2 * pad) / Math.max(spanY, spanX);
    const offsetX = (size - spanY * scale) / 2, offsetY = (size - spanX * scale) / 2;

    const pxPts = points.map(p => ({
        x: offsetX + (p[0] - minY) * scale, y: size - (offsetY + (p[1] - minX) * scale)
    }));

    ctx.beginPath();
    ctx.moveTo(pxPts[0].x, pxPts[0].y);
    for (let i = 1; i < pxPts.length; i++) ctx.lineTo(pxPts[i].x, pxPts[i].y);
    ctx.closePath();
    ctx.strokeStyle = "#14213d"; ctx.lineWidth = 4; ctx.stroke();

    const centerX = pxPts.reduce((s, p) => s + p.x, 0) / pxPts.length;
    const centerY = pxPts.reduce((s, p) => s + p.y, 0) / pxPts.length;

    ctx.fillStyle = "#000000"; ctx.font = "bold 28px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(cadnum, centerX, centerY);

    pxPts.forEach((pt, idx) => {
        const s = 7;
        ctx.fillStyle = "#ffffff"; ctx.fillRect(pt.x - s, pt.y - s, s * 2, s * 2);
        ctx.strokeStyle = "#14213d"; ctx.lineWidth = 2.5; ctx.strokeRect(pt.x - s, pt.y - s, s * 2, s * 2);
        const dx = pt.x - centerX, dy = pt.y - centerY;
        const dist = Math.max(Math.hypot(dx, dy), 1);
        ctx.fillStyle = "#000000"; ctx.font = "26px 'Courier New', monospace";
        ctx.fillText(String(idx + 1), pt.x + (dx/dist)*32, pt.y + (dy/dist)*32);
    });

    currentSchemaBase64 = canvas.toDataURL("image/jpeg", 0.95).split(',')[1];
    displayArea.style.display = "block";
    document.getElementById('actionButtons').style.display = "block";
}

// === ЛОГІКА СУПУТНИКОВОЇ КАРТИ ===
function lon2tileX(lon, zoom) { return ((lon + 180) / 360) * Math.pow(2, zoom); }
function lat2tileY(lat, zoom) { return ((1 - Math.log(Math.tan(lat * Math.PI/180) + 1 / Math.cos(lat * Math.PI/180)) / Math.PI) / 2) * Math.pow(2, zoom); }

function loadTile(z, x, y) {
    return new Promise((resolve) => {
        let img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => resolve({img, x, y});
        img.onerror = () => resolve(null);
        img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
    });
}

document.getElementById('shareSatBtn').onclick = async function() {
    if (currentWgs84Points.length === 0) {
        alert("Неможливо згенерувати супутник: помилка координат.");
        return;
    }
    const prevStatus = statusEl.innerText;
    statusEl.innerText = "⏳ Завантаження супутникових знімків... (зачекайте пару секунд)";
    this.disabled = true;

    try {
        const zoom = parseInt(document.getElementById('zoomSelect').value);
        const cLon = currentWgs84Points.reduce((s, p) => s + p.lon, 0) / currentWgs84Points.length;
        const cLat = currentWgs84Points.reduce((s, p) => s + p.lat, 0) / currentWgs84Points.length;
        const cTileX = lon2tileX(cLon, zoom);
        const cTileY = lat2tileY(cLat, zoom);
        
        const size = 1200; const halfSize = size / 2;
        const minTX = Math.floor((cTileX * 256 - halfSize) / 256);
        const maxTX = Math.floor((cTileX * 256 + halfSize) / 256);
        const minTY = Math.floor((cTileY * 256 - halfSize) / 256);
        const maxTY = Math.floor((cTileY * 256 + halfSize) / 256);

        let promises = [];
        for (let tx = minTX; tx <= maxTX; tx++) {
            for (let ty = minTY; ty <= maxTY; ty++) promises.push(loadTile(zoom, tx, ty));
        }
        const tiles = await Promise.all(promises);
        
        satCtx.fillStyle = "#1e1e1e";
        satCtx.fillRect(0, 0, size, size);

        tiles.forEach(t => {
            if (t) {
                let pxX = (t.x * 256) - (cTileX * 256 - halfSize);
                let pxY = (t.y * 256) - (cTileY * 256 - halfSize);
                satCtx.drawImage(t.img, pxX, pxY, 256, 256);
            }
        });

        let satPts = currentWgs84Points.map(p => {
            return {
                x: (lon2tileX(p.lon, zoom) * 256) - (cTileX * 256 - halfSize),
                y: (lat2tileY(p.lat, zoom) * 256) - (cTileY * 256 - halfSize)
            };
        });

        satCtx.beginPath();
        satCtx.moveTo(satPts[0].x, satPts[0].y);
        for (let i = 1; i < satPts.length; i++) satCtx.lineTo(satPts[i].x, satPts[i].y);
        satCtx.closePath();

        satCtx.fillStyle = "rgba(255, 0, 0, 0.25)"; satCtx.fill();
        satCtx.strokeStyle = "#ff0000"; satCtx.lineWidth = 4; satCtx.stroke();

        satCtx.font = "bold 26px 'Courier New', monospace";
        satCtx.textAlign = "center"; satCtx.textBaseline = "middle";
        satCtx.lineWidth = 4; satCtx.strokeStyle = "#ffffff";
        let titleTxt = currentBaseName === "Dilyanka" ? "Ділянка" : currentBaseName;
        satCtx.strokeText(titleTxt, halfSize, halfSize);
        satCtx.fillStyle = "#ff0000"; satCtx.fillText(titleTxt, halfSize, halfSize);

        satPts.forEach((pt, idx) => {
            const s = 6;
            satCtx.fillStyle = "#ffffff"; satCtx.fillRect(pt.x - s, pt.y - s, s * 2, s * 2);
            satCtx.strokeStyle = "#ff0000"; satCtx.lineWidth = 2; satCtx.strokeRect(pt.x - s, pt.y - s, s * 2, s * 2);
            const dx = pt.x - halfSize, dy = pt.y - halfSize;
            const dist = Math.max(Math.hypot(dx, dy), 1);
            const tx = pt.x + (dx/dist)*32, ty = pt.y + (dy/dist)*32;
            satCtx.lineWidth = 4; satCtx.strokeStyle = "#ffffff"; satCtx.strokeText(String(idx + 1), tx, ty);
            satCtx.fillStyle = "#000000"; satCtx.fillText(String(idx + 1), tx, ty);
        });

        let b64 = satCanvas.toDataURL("image/jpeg", 0.9).split(',')[1];
        
        satContainer.style.display = "block";
        statusEl.innerText = prevStatus + "\n✅ Супутник згенеровано!";

        shareNative(b64, "_Sat.jpg", "image/jpeg");

    } catch (e) {
        statusEl.innerText = prevStatus + "\n❌ Помилка: " + e.message;
    } finally {
        this.disabled = false;
    }
};

// === ЕКСПОРТ ЧЕРЕЗ НАТИВНЕ МЕНЮ ===
function utf8ToBase64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

function shareNative(base64Data, extension, mimeType) {
    const dataUrl = `df:${currentBaseName}${extension};data:${mimeType};base64,` + base64Data;
    if (window.plugins && window.plugins.socialsharing) {
        window.plugins.socialsharing.shareWithOptions({
            subject: currentBaseName + extension,
            files: [dataUrl]
        });
    } else {
        fallbackShare(base64Data, extension, mimeType);
    }
}

document.getElementById('shareTxtBtn').onclick = function() {
    shareNative(utf8ToBase64(currentTxtContent), ".txt", "text/plain");
};
document.getElementById('shareSchemaBtn').onclick = function() {
    shareNative(currentSchemaBase64, ".jpg", "image/jpeg");
};
document.getElementById('shareKmlBtn').onclick = function() {
    if (!currentKmlContent) return;
    shareNative(utf8ToBase64(currentKmlContent), ".kml", "application/vnd.google-earth.kml+xml");
};
document.getElementById('copyTxtBtn').onclick = function() {
    const txtArea = document.getElementById('txtPreview');
    txtArea.select(); document.execCommand('copy');
    statusEl.innerText += "\n✅ Координати в буфері!";
};

function fallbackShare(base64Data, ext, mimeType) {
    const byteNumbers = new Array(base64Data.length);
    let binStr = atob(base64Data);
    for (let i = 0; i < binStr.length; i++) byteNumbers[i] = binStr.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], {type: mimeType});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentBaseName + ext;
    a.click();
}
</script>

</body>
</html>
