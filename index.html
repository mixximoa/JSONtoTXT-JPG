<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кадастр JSON -> TXT / JPG (RTK)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            color: #14213d;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; font-size: 19px; color: #14213d; }
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: #1d6fa5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-green { background: #2a9d8f; }
        .btn-dark { background: #14213d; }
        .btn-orange { background: #e76f51; }
        input[type="file"] { display: none; }
        #status {
            margin: 10px 0;
            font-size: 14px;
            color: #222;
            white-space: pre-line;
            font-weight: 600;
            background: #eef4f8;
            padding: 10px;
            border-radius: 8px;
        }
        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 140px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: none;
        }
        .actions { display: none; margin-top: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Конвертер ДЗК (JSON ➔ TXT + JPG)</h2>
    
    <label class="btn" for="fileInput">📂 1. Обрати JSON файл кадастру</label>
    <input type="file" id="fileInput" accept="*/*">

    <div id="status">Очікування вибору файлу...</div>

    <div class="actions" id="actionButtons">
        <button class="btn btn-green" id="shareBothBtn">📤 Зберегти / Надіслати TXT + JPG</button>
        <button class="btn btn-dark" id="shareTxtBtn">📄 Зберегти / Надіслати тільки TXT</button>
        <button class="btn btn-orange" id="copyTxtBtn">📋 Скопіювати координати TXT</button>
    </div>

    <textarea id="txtPreview" readonly></textarea>
    <canvas id="plotCanvas" width="1200" height="1200"></canvas>
</div>

<script src="cordova.js"></script>
<script>
let currentTxtContent = "";
let currentJpgBase64 = "";
let currentBaseName = "";
const canvas = document.getElementById('plotCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            processGeoJSON(JSON.parse(evt.target.result));
        } catch (err) {
            statusEl.innerText = "❌ Помилка формату JSON: " + err.message;
        }
    };
    reader.readAsText(file);
});

function processGeoJSON(data) {
    const cadnum = (data.properties && data.properties.cadnum) ? data.properties.cadnum : "unknown";
    currentBaseName = cadnum.replace(/:/g, "");

    let coordsRaw = data.coordinates[0][0];
    let points = coordsRaw;
    if (coordsRaw.length > 1) {
        const first = coordsRaw[0];
        const last = coordsRaw[coordsRaw.length - 1];
        if (first[0] === last[0] && first[1] === last[1]) {
            points = coordsRaw.slice(0, -1);
        }
    }

    // 1. Формуємо TXT (Номер, X_Північ, Y_Схід, 0)
    let txtLines = [];
    points.forEach((pt, idx) => {
        const yEast = Number(pt[0]);
        const xNorth = Number(pt[1]);
        txtLines.push(`${idx + 1},${xNorth},${yEast},0`);
    });
    currentTxtContent = txtLines.join("\r\n") + "\r\n";

    const txtArea = document.getElementById('txtPreview');
    txtArea.value = currentTxtContent;
    txtArea.style.display = "block";

    // 2. Малюємо JPG схему на Canvas (1200x1200)
    const size = 1200;
    const pad = 180;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);

    const ys = points.map(p => p[0]);
    const xs = points.map(p => p[1]);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const minX = Math.min(...xs), maxX = Math.max(...xs);

    const spanY = Math.max(maxY - minY, 0.001);
    const spanX = Math.max(maxX - minX, 0.001);
    const scale = (size - 2 * pad) / Math.max(spanY, spanX);

    const offsetX = (size - spanY * scale) / 2;
    const offsetY = (size - spanX * scale) / 2;

    const pxPts = points.map(p => ({
        x: offsetX + (p[0] - minY) * scale,
        y: size - (offsetY + (p[1] - minX) * scale)
    }));

    ctx.beginPath();
    ctx.moveTo(pxPts[0].x, pxPts[0].y);
    for (let i = 1; i < pxPts.length; i++) {
        ctx.lineTo(pxPts[i].x, pxPts[i].y);
    }
    ctx.closePath();
    ctx.strokeStyle = "#14213d";
    ctx.lineWidth = 4;
    ctx.stroke();

    const centerX = pxPts.reduce((s, p) => s + p.x, 0) / pxPts.length;
    const centerY = pxPts.reduce((s, p) => s + p.y, 0) / pxPts.length;

    ctx.fillStyle = "#000000";
    ctx.font = "28px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(cadnum, centerX, centerY);

    pxPts.forEach((pt, idx) => {
        const s = 7;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(pt.x - s, pt.y - s, s * 2, s * 2);
        ctx.strokeStyle = "#14213d";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(pt.x - s, pt.y - s, s * 2, s * 2);

        const dx = pt.x - centerX;
        const dy = pt.y - centerY;
        const dist = Math.max(Math.hypot(dx, dy), 1);
        const tx = pt.x + (dx / dist) * 32;
        const ty = pt.y + (dy / dist) * 32;

        ctx.fillStyle = "#000000";
        ctx.font = "28px 'Courier New', monospace";
        ctx.fillText(String(idx + 1), tx, ty);
    });

    // Формуємо правильний заголовок df:filename для JPG
    const rawJpgBase64 = canvas.toDataURL("image/jpeg", 0.95).split(',')[1];
    currentJpgBase64 = `df:${currentBaseName}.jpg;data:image/jpg;base64,` + rawJpgBase64;

    canvas.style.display = "block";
    document.getElementById('actionButtons').style.display = "block";
    statusEl.innerText = `✅ Створено: ${currentBaseName}.txt та .jpg!`;
}

function utf8ToBase64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
}

// Префікс df:ім'я_файлу.txt;data:text/txt;base64,... у cordova-plugin-x-socialsharing
// примусово задає і точне ім'я файлу (кадастровий номер), і розширення .txt!
document.getElementById('shareBothBtn').onclick = function() {
    const txtDataUrl = `df:${currentBaseName}.txt;data:text/txt;base64,` + utf8ToBase64(currentTxtContent);
    if (window.plugins && window.plugins.socialsharing) {
        window.plugins.socialsharing.shareWithOptions({
            subject: currentBaseName,
            files: [txtDataUrl, currentJpgBase64]
        });
    } else {
        fallbackShare();
    }
};

document.getElementById('shareTxtBtn').onclick = function() {
    const txtDataUrl = `df:${currentBaseName}.txt;data:text/txt;base64,` + utf8ToBase64(currentTxtContent);
    if (window.plugins && window.plugins.socialsharing) {
        window.plugins.socialsharing.shareWithOptions({
            subject: currentBaseName + ".txt",
            files: [txtDataUrl]
        });
    } else {
        fallbackShare();
    }
};

document.getElementById('copyTxtBtn').onclick = function() {
    const txtArea = document.getElementById('txtPreview');
    txtArea.select();
    document.execCommand('copy');
    statusEl.innerText = "✅ Координати скопійовано в буфер обміну!";
};

function fallbackShare() {
    const blob = new Blob([currentTxtContent], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentBaseName + ".txt";
    a.click();
}
</script>

</body>
</html>
