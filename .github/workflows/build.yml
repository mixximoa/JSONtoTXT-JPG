name: Build Fast Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android Licenses & Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          npm install -g cordova
          cordova create app org.geodesy.cadastre CadastreRTK
          cp index.html app/www/index.html
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: CadastreRTK-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
