name: Build Fast Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build WebAPK with Cordova
        run: |
          npm install -g cordova
          cordova create app org.geodesy.cadastre CadastreRTK
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: CadastreRTK-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
